name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build driver
        run: |
          if [ -f packaging/build-driver.sh ]; then
            packaging/build-driver.sh
          fi
      - name: Bundle app
        run: |
          if [ -f packaging/bundle-app.sh ]; then
            packaging/bundle-app.sh
          fi
      - name: Verify signatures
        run: |
          for b in target/SoundRouter.app target/SoundRouter.driver; do
            if [ -e "$b" ]; then
              codesign --verify --deep --strict "$b"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: soundrouter-bundles
          if-no-files-found: ignore
          path: |
            target/SoundRouter.app
            target/SoundRouter.driver

  driver-smoke:
    # Experimental: unverified whether coreaudiod loads the plug-in on hosted runners.
    runs-on: macos-14
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install driver
        run: |
          if [ -f packaging/build-driver.sh ]; then
            packaging/build-driver.sh
            sudo cp -R target/SoundRouter.driver /Library/Audio/Plug-Ins/HAL/
            sudo killall coreaudiod || true
          fi
          sleep 5
      - name: Check device is listed
        run: system_profiler SPAudioDataType | grep -A3 SoundRouter
