name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about
      - name: Dependency policy
        run: cargo deny check licenses bans sources
      - name: Advisories (live DB, non-blocking)
        run: cargo deny check advisories
        continue-on-error: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build driver
        run: packaging/build-driver.sh
      - name: Driver fakehost smoke
        run: packaging/driver-dev.sh fakehost
      - name: Bundle app
        run: packaging/bundle-app.sh
      - name: Verify signatures
        run: |
          for b in target/SoundRouter.app target/SoundRouter.driver; do
            codesign --verify --deep --strict "$b"
          done
      - name: Zip bundles
        run: |
          cd target
          ditto -c -k --keepParent SoundRouter.app SoundRouter.app.zip
          ditto -c -k --keepParent SoundRouter.driver SoundRouter.driver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: soundrouter-bundles
          if-no-files-found: error
          path: |
            target/SoundRouter.app.zip
            target/SoundRouter.driver.zip

  driver-smoke:
    # Experimental: unverified whether coreaudiod loads the plug-in on hosted runners.
    runs-on: macos-15
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Build and install driver
        run: |
          packaging/build-driver.sh
          sudo cp -R target/SoundRouter.driver /Library/Audio/Plug-Ins/HAL/
          sudo killall coreaudiod || true
          sleep 5
      - name: Check device is listed
        run: system_profiler SPAudioDataType | grep -A3 SoundRouter

  coverage:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Summary
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  snapshots:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p soundrouter-app --features snapshots
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          if-no-files-found: ignore
          path: |
            **/*.new.png
            **/*.diff.png
            **/*.new
            **/snapshots/**/*.diff.*

  blackhole-e2e:
    # Experimental: hosted runners may deny audio-capture TCC, so this can fail for reasons unrelated to the code.
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install BlackHole
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
      - run: cargo test -p sr-audio --test blackhole -- --ignored
