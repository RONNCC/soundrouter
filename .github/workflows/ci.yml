name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency: # a newer push to the same PR supersedes its running checks; every main commit keeps its own run
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "14.2" # same as packaging/lib.sh, so cargo steps and the scripts share build artifacts

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30 # a hung test or fakehost must fail, not hold the runner for the 6 h default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about
      - name: Dependency policy
        run: cargo deny check licenses bans sources
      - name: Advisories (live DB, non-blocking)
        run: cargo deny check advisories
        continue-on-error: true
      - run: cargo fmt --all --check
      - name: Shell lint
        run: |
          command -v shellcheck >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install shellcheck
          shellcheck packaging/*.sh
          packaging/test-uninstall.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build driver
        run: packaging/build-driver.sh
      - name: Driver fakehost smoke
        run: packaging/driver-dev.sh fakehost
      - name: Bundle app
        run: packaging/bundle-app.sh
      - name: Verify signatures
        run: |
          for b in target/SoundRouter.app target/SoundRouter.driver; do
            codesign --verify --deep --strict "$b"
          done
      - name: Build pkg (unsigned; checks its component settings)
        run: packaging/make-pkg.sh
      - name: Zip bundles
        run: |
          cd target
          ditto -c -k --keepParent SoundRouter.app SoundRouter.app.zip
          ditto -c -k --keepParent SoundRouter.driver SoundRouter.driver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: soundrouter-bundles
          if-no-files-found: error
          path: |
            target/SoundRouter.app.zip
            target/SoundRouter.driver.zip

  driver-smoke:
    # Experimental: unverified whether coreaudiod loads the plug-in on hosted runners.
    runs-on: macos-15
    needs: build
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Build and install driver
        run: |
          packaging/build-driver.sh
          sudo cp -R target/SoundRouter.driver /Library/Audio/Plug-Ins/HAL/
          sudo killall coreaudiod || true
          sleep 5
      - name: Check device is listed
        run: system_profiler SPAudioDataType | grep -A3 SoundRouter

  coverage:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Summary
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  snapshots:
    # Baselines come from an Apple-silicon Mac. The hosted runner's paravirtual GPU anti-aliases glyph
    # edges a little differently: measured at most 427 differing pixels per frame (1180x700) at the
    # default threshold. The CI-only kittest.toml allows 800, so layout and colour changes (thousands of
    # pixels) still fail while that drift does not; text content is asserted by the plain app tests.
    # Local runs have no kittest.toml and stay pixel-exact.
    runs-on: macos-15
    continue-on-error: true # a runner image update can move the drift; diffs are uploaded below
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Tolerate hosted-GPU anti-aliasing drift
        run: echo 'max_failed_pixels = 800' > kittest.toml
      - run: cargo test -p soundrouter-app --features snapshots
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          if-no-files-found: ignore
          path: |
            app/tests/snapshots/*.new.png
            app/tests/snapshots/*.diff.png

  blackhole-e2e:
    # Experimental: verifies routing through a real process tap and the engine into BlackHole only when
    # the runner allows audio capture. The image grants Microphone (the BlackHole input) to the runner
    # agent but not Audio Capture (process taps), and nobody can answer that prompt here, so it is
    # pre-granted below; if macOS ignores the grant the run times out and the logs show the stage.
    # Silent by design: the test builds packaging/srtone.c (clang) and plays only into BlackHole ch 8-9.
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install BlackHole (retried) and wait for coreaudiod to list it
        run: |
          for i in 1 2 3; do
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask blackhole-16ch && break
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
          sudo killall coreaudiod || true
          for _ in $(seq 30); do
            system_profiler SPAudioDataType | grep -q 'BlackHole 16ch' && exit 0
            sleep 2
          done
          echo "::error::BlackHole 16ch never appeared in coreaudiod"; exit 1
      - name: Pre-grant Audio Capture to the runner agent
        run: |
          # Same row shape and owners as the image's configure-tccdb-macos.sh (user db as the user, system
          # db with sudo); SIP is off on hosted runners.
          now=$(date +%s)
          for client in /opt/hca/hosted-compute-agent /usr/local/opt/runner/provisioner/provisioner /bin/bash; do
            row="INSERT OR REPLACE INTO access VALUES('kTCCServiceAudioCapture','$client',1,2,4,1,NULL,NULL,NULL,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now);"
            sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$row" || echo "::warning::user TCC.db: $client"
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "$row" || echo "::warning::system TCC.db: $client"
          done
          sudo killall tccd 2>/dev/null || true
      - name: Build e2e
        run: cargo test -p sr-audio --test blackhole --no-run
      - name: Run e2e (2 attempts of 180 s; a SKIP fails instead of passing silently)
        run: |
          set -o pipefail
          for attempt in 1 2; do
            # perl alarm: macOS has no coreutils timeout, and an unanswered TCC prompt blocks forever
            if perl -e 'alarm shift; exec @ARGV' 180 \
                cargo test -p sr-audio --test blackhole -- --ignored --nocapture 2>&1 | tee "blackhole-$attempt.log"; then
              if grep -q '^SKIP' "blackhole-$attempt.log"; then
                echo "::error::the engine did not find BlackHole 16ch"; exit 1
              fi
              exit 0
            fi
            echo "::warning::attempt $attempt failed; last stage: $(grep '^stage:' "blackhole-$attempt.log" | tail -1)"
            pkill -f 'target/debug/deps/blackhole-' || true
            sleep 5
          done
          exit 1
      - name: Collect TCC and coreaudiod logs
        if: always()
        run: |
          log show --last 20m --style compact \
            --predicate 'subsystem == "com.apple.TCC" OR process == "coreaudiod"' > system.log 2>&1 || true
          grep -iE 'AudioCapture|Microphone' system.log | tail -40 || true
      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-e2e-logs
          if-no-files-found: ignore
          path: |
            blackhole-*.log
            system.log
