name: release

# Tag push vX.Y.Z builds the .pkg/.dmg and attaches them to a GitHub release.
# Without the signing secrets the build is ad-hoc signed and the release says so.
# workflow_dispatch builds and uploads artifacts only (no release): use it to dry-run the pipeline.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      CERT_P12: ${{ secrets.CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      SIGN_ID: ${{ secrets.SIGN_ID }}
      INSTALLER_ID: ${{ secrets.INSTALLER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CFBundleVersion = commit count
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-about
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(awk -F'"' '/^\[/ { ws = ($0 == "[workspace.package]") } ws && /^version[ ]*=/ { print $2; exit }' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != workspace version v$version (Cargo.toml)" >&2; exit 1; }
      - name: Import signing certificates
        if: env.CERT_P12 != '' && env.SIGN_ID != ''
        run: |
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ci.keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Bundle app (builds the driver, generates ThirdPartyLicenses)
        run: REQUIRE_NOTICES=1 packaging/bundle-app.sh
      - name: Build pkg and dmg
        run: |
          packaging/make-pkg.sh
          packaging/make-dmg.sh
      - name: Notarize
        if: env.NOTARY_APPLE_ID != '' && env.NOTARY_TEAM_ID != '' && env.NOTARY_PASSWORD != '' && env.SIGN_ID != '' && env.INSTALLER_ID != ''
        run: |
          xcrun notarytool store-credentials sr-ci --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          export NOTARY_PROFILE=sr-ci
          packaging/notarize.sh target/SoundRouter.pkg
          packaging/notarize.sh target/SoundRouter.dmg
      - name: Zip bundles and checksum
        run: |
          cd target
          ditto -c -k --keepParent SoundRouter.app SoundRouter.app.zip
          ditto -c -k --keepParent SoundRouter.driver SoundRouter.driver.zip
          shasum -a 256 SoundRouter.pkg SoundRouter.dmg SoundRouter.app.zip SoundRouter.driver.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SoundRouter
          path: |
            target/SoundRouter.pkg
            target/SoundRouter.dmg
            target/SoundRouter.app.zip
            target/SoundRouter.driver.zip
            target/SHA256SUMS.txt
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ env.NOTARY_APPLE_ID != '' && env.NOTARY_TEAM_ID != '' && env.NOTARY_PASSWORD != '' && env.SIGN_ID != '' && env.INSTALLER_ID != '' }}
        run: |
          if [ "$NOTARIZED" = true ]; then
            notes="Developer ID signed and notarized."
          else
            notes="**UNSIGNED build (ad-hoc signed, not notarized).** Gatekeeper blocks the first launch: right-click the app and choose Open, or on macOS 15 use System Settings > Privacy & Security > Open Anyway. See docs/RELEASING.md."
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes "$notes" --title "$GITHUB_REF_NAME" \
            target/SoundRouter.pkg target/SoundRouter.dmg \
            target/SoundRouter.app.zip target/SoundRouter.driver.zip target/SHA256SUMS.txt
