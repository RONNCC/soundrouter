name: release

# Tag push vX.Y.Z builds the .pkg/.dmg and attaches them to a GitHub release.
# Without the signing secrets the build is ad-hoc signed and the release says so.
# workflow_dispatch builds and uploads artifacts only (no release): use it to dry-run the pipeline.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "14.2" # same as packaging/lib.sh

jobs:
  release:
    runs-on: macos-15
    outputs:
      notarized: ${{ env.NOTARIZED }}
    env:
      # Only these booleans are job-wide; each secret goes to the step that needs it, never to cargo (build scripts
      # of every dependency run there) before the signing key is in a keychain.
      HAVE_CERT: ${{ secrets.CERT_P12 != '' && secrets.SIGN_ID != '' }}
      NOTARIZED: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_PASSWORD != '' && secrets.SIGN_ID != '' && secrets.INSTALLER_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # CFBundleVersion = commit count
          persist-credentials: false # build scripts must not find a token in .git
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; pinned by SHA, so the toolchain is explicit
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@b298e4e5434569d3c7ccff7c9592b69de2fe37fe # cargo-about
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(awk -F'"' '/^\[/ { ws = ($0 == "[workspace.package]") } ws && /^version[ ]*=/ { print $2; exit }' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != workspace version v$version (Cargo.toml)" >&2; exit 1; }
      - name: Build (no signing key or secret present yet)
        run: |
          cargo build --release --locked -p soundrouter-app -p sr-cli
          cargo build --release --locked -p soundrouter-driver
      - name: Import signing certificates
        if: env.HAVE_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ci.keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Bundle app (reuses the build above, generates ThirdPartyLicenses)
        env:
          SIGN_ID: ${{ secrets.SIGN_ID }}
        run: REQUIRE_NOTICES=1 packaging/bundle-app.sh
      - name: Build pkg and dmg
        env:
          SIGN_ID: ${{ secrets.SIGN_ID }}
          INSTALLER_ID: ${{ secrets.INSTALLER_ID }}
        run: |
          packaging/make-pkg.sh
          packaging/make-dmg.sh
      - name: Notarize
        if: env.NOTARIZED == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials sr-ci --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          export NOTARY_PROFILE=sr-ci
          packaging/notarize.sh target/SoundRouter.pkg
          packaging/notarize.sh target/SoundRouter.dmg
      - name: Zip bundles and checksum
        run: |
          cd target
          ditto -c -k --keepParent SoundRouter.app SoundRouter.app.zip
          ditto -c -k --keepParent SoundRouter.driver SoundRouter.driver.zip
          shasum -a 256 SoundRouter.pkg SoundRouter.dmg SoundRouter.app.zip SoundRouter.driver.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoundRouter
          path: |
            target/SoundRouter.pkg
            target/SoundRouter.dmg
            target/SoundRouter.app.zip
            target/SoundRouter.driver.zip
            target/SHA256SUMS.txt

  publish:
    # The only job with a write token, and it runs no third-party action and no build step: the build above
    # (cargo build scripts, installed actions, the signing key) only ever sees a read-only token.
    needs: release
    if: github.event_name == 'push' # a dispatch, even on a tag, is a dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SoundRouter
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ needs.release.outputs.notarized }}
        run: |
          if [ "$NOTARIZED" = true ]; then
            notes="Developer ID signed and notarized."
          else
            notes="**UNSIGNED build (ad-hoc signed, not notarized).** Gatekeeper blocks the first launch: right-click the app and choose Open, or on macOS 15 use System Settings > Privacy & Security > Open Anyway. See docs/RELEASING.md."
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --notes "$notes" --title "$GITHUB_REF_NAME" \
            dist/SoundRouter.pkg dist/SoundRouter.dmg \
            dist/SoundRouter.app.zip dist/SoundRouter.driver.zip dist/SHA256SUMS.txt
