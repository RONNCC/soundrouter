[package]
name = "soundrouter-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "SoundRouter"
path = "src/main.rs"

[dependencies]
sr-core = { path = "../crates/sr-core" }
sr-audio = { path = "../crates/sr-audio" }
anyhow.workspace = true
serde_json.workspace = true
eframe = "=0.37.0"
log = "0.4"
fern = "0.7"
humantime = "2"
env_filter = { version = "2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSColorSpace"] }

[features]
# GPU (Metal) snapshot tests and the docs screenshots; off by default so plain `cargo test` needs no GPU.
snapshots = []

[dev-dependencies]
proptest = "1"
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3"
