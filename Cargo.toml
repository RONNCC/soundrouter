[workspace]
resolver = "3"
members = ["crates/sr-core", "crates/sr-audio", "crates/sr-cli", "driver", "app"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.4.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware"] }
objc2-core-audio-types = "0.3"
