[package]
name = "soundrouter-driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sr-core = { path = "../crates/sr-core" }
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["core_audio", "audio_server_plugin"] }

[dev-dependencies]
proptest = "1"
